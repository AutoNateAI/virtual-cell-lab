# Written and committed before any expression value was read. Only the dataset's list of cell types was looked at.
id: x02-two-cell-types
title: "Put a lung cell and an immune cell side by side and see which genes give them away"
kind: exploration
status: complete
registered: 2026-11-08
question: "In real human cells from one lung dataset, how much of the genome is on, and which genes tell two cell types apart?"
predictions:
  - statement: "The median cell of each type has RNA detected from fewer than half of protein-coding genes."
    refuted_by: "A median of half or more in either type."
  - statement: "SFTPC, a surfactant gene, is detected in most type 2 alveolar cells and in few T cells."
    refuted_by: "Under 50% of type 2 alveolar cells, or over 10% of T cells."
  - statement: "CD3E, a T cell receptor component, is detected in most T cells and in few type 2 alveolar cells."
    refuted_by: "Under 50% of T cells, or over 10% of type 2 alveolar cells."
  - statement: "ACTB, a structural gene, is detected in most cells of both types."
    refuted_by: "Under 50% of cells in either type."
  - statement: "CFTR is detected in under 10% of cells of both types, because neither is the mucus-making cell from Episode 5."
    refuted_by: "10% or more in either type."
dataset:
  name: "Tabula Sapiens - Lung, via CZ CELLxGENE Census 2025-11-08"
  url: https://cellxgene.cziscience.com/
  retrieved: 2026-11-08
  license: "CELLxGENE data reported as CC BY 4.0 by a secondary source; the dataset's own page could not be read. Only summary tables derived from it are kept"
  subset: "dataset 0d2ee4ac-05ee-40b2-afb6-ebb584caa867, assay 10x 3' v3; up to 1,000 cells each of pulmonary alveolar type 2 cell and CD4-positive, alpha-beta T cell, sampled with seed 13; protein-coding genes only"
  citation: "The Tabula Sapiens Consortium, Science 2022, doi 10.1126/science.abl4896; CZ CELLxGENE Census"
compute:
  where: local
  notes: "runs/x02-two-cell-types/compare.py, needs cellxgene-census, numpy and pandas"

# ─── everything below is written only after the run ───
observed: >
  Three of five predictions held and two missed. The median type 2 alveolar cell had RNA detected from 4,982 of 20,080
  protein-coding genes (24.8%) and the median CD4 T cell from 1,792 (8.9%). CD3E was detected in 70.8% of T cells and 1.8% of
  type 2 cells. ACTB was detected in 98.9% and 89.9%. MISS: SFTPC was detected in 99.9% of type 2 cells but also in 88.5% of T
  cells. MISS: CFTR was detected in 65.4% of type 2 cells and 1.4% of T cells. Genes on in at least 10% of cells: 10,468 in
  type 2 cells and 5,683 in T cells, with 5,350 on in both. Post hoc, SFTPC averaged 1,994 molecules per type 2 cell (6.8% of
  its RNA) against 4.82 per T cell (0.107%).
interpreted: >
  Detecting a gene is not the same as a cell using it. The SFTPC signal in T cells is about 400-fold smaller per cell than in
  type 2 cells, which fits droplet data picking up cell-free RNA from a very abundant transcript, but this run did not test
  that. Our reasoning about CFTR was too narrow: a cell type we assumed would not use it had low counts in most cells, while T
  cells almost never had any, which argues against the same background explanation.
failures:
  - "SFTPC prediction missed: 88.5% of T cells had at least one molecule, against a limit of 10%."
  - "CFTR prediction missed: 65.4% of type 2 alveolar cells had at least one molecule, against a limit of 10%."
  - "The molecule count was added after the result (commit b698056) and is labelled post hoc. Ambient RNA is a hypothesis for the SFTPC result. We did not correct for it."
  - "Detection means at least one molecule. It is not evidence of a working protein."
  - "One dataset, one assay, 1,000 cells of each type from a small number of donors, with no test of donor effects."
  - "The 10% threshold for calling a gene on is our choice, and the on/off counts change with it."
  - "The dataset's own licence page could not be read; only a secondary source reports CC BY 4.0."
artifact: runs/x02-two-cell-types/results.md
